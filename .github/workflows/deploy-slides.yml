name: Deploy slides to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Render Marp drafts to HTML
        run: |
          mkdir -p dist
          for f in slides/*-draft.md; do
            name=$(basename "$f" -draft.md)
            # 주의: --theme-set은 배열 옵션이라 뒤에 오는 입력 파일까지 삼킨다.
            # 입력 파일을 반드시 옵션보다 앞에 둘 것.
            npx -y @marp-team/marp-cli@latest "$f" --theme-set slides/themes/lab.css -o "dist/${name}.html"
          done
          [ -d slides/assets ] && cp -r slides/assets dist/assets || true
          # 렌더 산출물 검증: 슬라이드 HTML이 하나도 없으면 실패시켜 빈 배포를 막는다
          ls dist/part*.html

      # 최종 PPTX가 만들어지면 여기서 PDF 변환본과 다운로드용 원본을 dist에 추가:
      #   sudo apt-get install -y libreoffice
      #   soffice --headless --convert-to pdf --outdir dist slides/final/claude-guide.pptx
      #   cp slides/final/claude-guide.pptx dist/

      - name: Copy index page
        run: cp site/index.html dist/index.html
        # site/index.html은 큐레이션된 랜딩 페이지 — 새 파트 초안이 추가되면
        # 이 파일의 카드 목록도 함께 갱신할 것

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
